<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Anggota - Hospital Kemaman</title>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }

        header {
            background-color: #005b96;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        header h3 {
            font-size: 1rem;
            margin: 5px 0 0 0;
            font-weight: normal;
            opacity: 0.9;
        }

        section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.1rem;
            color: #005b96;
            margin-top: 0;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafafa;
        }

        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #005b96;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .status-loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- TAJUK UTAMA -->
    <header>
        <h1>SISTEM DATA ANGGOTA</h1>
        <h3>Hospital Kemaman</h3>
    </header>

    <main>
        <!-- BORANG INPUT DATA -->
        <section>
            <h2>Borang Pendaftaran Tugas / Data</h2>
            <form id="dataForm">
                <div class="form-group">
                    <label for="nama">Nama Anggota:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama penuh" required>
                </div>

                <div class="form-group">
                    <label for="jawatan">Kategori Anggota:</label>
                    <select id="jawatan" name="jawatan" required>
                        <option value="">-- Pilih Jawatan --</option>
                        <option value="PEMANDU">Pemandu</option>
                        <option value="PPP">Penolong Pegawai Perubatan (PPP)</option>
                        <option value="PPK">Pembantu Perawatan Kesihatan (PPK)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notel">No. Telefon:</label>
                    <input type="tel" id="notel" name="notel" placeholder="Contoh: 0123456789" required>
                </div>

                <button type="submit" id="btnHantar">Hantar Data ke Google Sheets</button>
            </form>
        </section>

        <!-- JADUAL SENARAI KESELURUHAN REKOD -->
        <section>
            <h2>Senarai Keseluruhan Rekod (Google Sheets)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Bil.</th>
                            <th>Masa / Tarikh</th>
                            <th>Nama Anggota</th>
                            <th>Kategori</th>
                            <th>No. Telefon</th>
                        </tr>
                    </thead>
                    <tbody id="senaraiAnggota">
                        <tr>
                            <td colspan="5" class="status-loading">Sedang memuatkan data dari Google Sheets...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- KOD JAVASCRIPT API READ & WRITE -->
    <script>
        // ⚠️ TETAPKAN WEB APP URL ANDA DI SINI
        const API_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbyv3-u1PE_zH_nuLeFiMkvP1K5lsHp2zEuIwT7vvkduBc0Q4brXUN8lIbC39GF6sU5p/exec";

        const borang = document.getElementById('dataForm');
        const jadualBody = document.getElementById('senaraiAnggota');
        const btnHantar = document.getElementById('btnHantar');

        // FUNGSI MEMBACA DATA DARI GOOGLE SHEETS (READ)
        function muatDataPenuh() {
            jadualBody.innerHTML = '<tr><td colspan="5" class="status-loading">Sedang memuatkan data dari Google Sheets...</td></tr>';

            fetch(API_URL)
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    jadualBody.innerHTML = ""; // Kosongkan jadual

                    if (res.data.length === 0) {
                        jadualBody.innerHTML = '<tr><td colspan="5" class="status-loading">Tiada rekod dijumpai.</td></tr>';
                        return;
                    }

                    // Susun data ke dalam jadual
                    res.data.forEach((item, index) => {
                        const baris = document.createElement('tr');
                        baris.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${item.timestamp}</td>
                            <td>${item.nama}</td>
                            <td>${item.jawatan}</td>
                            <td>${item.notel}</td>
                        `;
                        jadualBody.appendChild(baris);
                    });
                } else {
                    jadualBody.innerHTML = '<tr><td colspan="5" class="status-loading">Gagal memuatkan data.</td></tr>';
                }
            })
            .catch(err => {
                jadualBody.innerHTML = '<tr><td colspan="5" class="status-loading">Ralat Sambungan API.</td></tr>';
            });
        }

        // MEMANGGIL FUNGSI READ SEBAIK SAHAJA LAMAN DIBUKA
        window.onload = muatDataPenuh;

        // FUNGSI MENGHANTAR DATA (CREATE)
        borang.addEventListener('submit', function(e) {
            e.preventDefault();

            btnHantar.disabled = true;
            btnHantar.innerText = "Sedang Menyimpan...";

            const formData = {
                nama: document.getElementById('nama').value,
                jawatan: document.getElementById('jawatan').value,
                notel: document.getElementById('notel').value
            };

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert("✅ Data Berjaya Dihantar!");
                borang.reset();
                btnHantar.disabled = false;
                btnHantar.innerText = "Hantar Data ke Google Sheets";
                
                // Muat semula jadual secara automatik untuk dapatkan data terkini!
                setTimeout(muatDataPenuh, 1500);
            })
            .catch(error => {
                alert("❌ Ralat: " + error);
                btnHantar.disabled = false;
                btnHantar.innerText = "Hantar Data ke Google Sheets";
            });
        });
    </script>

</body>
</html>
