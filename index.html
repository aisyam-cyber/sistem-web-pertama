<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Anggota - Hospital Kemaman</title>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }

        header {
            background-color: #005b96;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        header h3 {
            font-size: 1rem;
            margin: 5px 0 0 0;
            font-weight: normal;
            opacity: 0.9;
        }

        section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.1rem;
            color: #005b96;
            margin-top: 0;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafafa;
        }

        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .btn-edit {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-padam {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-logout {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            margin-top: -35px;
        }

        .user-bar {
            background-color: #e3f2fd;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #005b96;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .status-loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        /* TERSEMBUNYI SECARA DEFAULT */
        #mainAppScreen {
            display: none;
        }
    </style>
</head>
<body>

    <!-- TAJUK UTAMA -->
    <header>
        <h1>SISTEM DATA ANGGOTA</h1>
        <h3>Hospital Kemaman</h3>
    </header>

    <!-- 1. SKRIN LOGIN -->
    <main id="loginScreen">
        <section>
            <h2>Log Masuk Sistem</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ID Pengguna:</label>
                    <input type="text" id="username" placeholder="Contoh: ADM01 / USR01" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Laluan:</label>
                    <input type="password" id="password" placeholder="Masukkan kata laluan" required>
                </div>

                <button type="submit" id="btnLogin">Log Masuk</button>
            </form>
        </section>
    </main>

    <!-- 2. SKRIN UTAMA (UTAMA SISTEM) -->
    <main id="mainAppScreen">
        
        <!-- BAR STATUS PENGGUNA -->
        <div class="user-bar">
            <span>Log masuk sebagai: <strong id="lblNamaUser">-</strong> (<span id="lblRoleUser">-</span>)</span>
            <button class="btn-logout" onclick="logOut()">Log Keluar</button>
        </div>

        <!-- BORANG INPUT DATA -->
        <section>
            <h2 id="tajukBorang">Borang Pendaftaran Tugas / Data</h2>
            <form id="dataForm">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label for="nama">Nama Anggota:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama penuh" required>
                </div>

                <div class="form-group">
                    <label for="jawatan">Kategori Anggota:</label>
                    <select id="jawatan" name="jawatan" required>
                        <option value="">-- Pilih Jawatan --</option>
                        <option value="PEMANDU">Pemandu</option>
                        <option value="PPP">Penolong Pegawai Perubatan (PPP)</option>
                        <option value="PPK">Pembantu Perawatan Kesihatan (PPK)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notel">No. Telefon:</label>
                    <input type="tel" id="notel" name="notel" placeholder="Contoh: 0123456789" required>
                </div>

                <button type="submit" id="btnHantar">Hantar Data ke Google Sheets</button>
                <button type="button" id="btnBatal" style="display:none; margin-top:10px; background:#6c757d;" onclick="batalEdit()">Batal Kemas Kini</button>
            </form>
        </section>

        <!-- JADUAL REKOD -->
        <section>
            <h2>Senarai Keseluruhan Rekod (Google Sheets)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Bil.</th>
                            <th>Masa / Tarikh</th>
                            <th>Nama Anggota</th>
                            <th>Kategori</th>
                            <th>No. Telefon</th>
                            <th id="thTindakan">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="senaraiAnggota">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- KOD JAVASCRIPT AUTH & ROLES -->
    <script>
        // ⚠️ TETAPKAN WEB APP URL ANDA DI SINI
        const API_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbwPsZ8tA20_1ABxY3k2qvTv7xGwF6RMOV40b78_EsLuHgyF-lFDRCAIAqTvYullnA0t/exec";

        // ELEMEN DOM
        const loginScreen = document.getElementById('loginScreen');
        const mainAppScreen = document.getElementById('mainAppScreen');
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        
        const borang = document.getElementById('dataForm');
        const jadualBody = document.getElementById('senaraiAnggota');
        const btnHantar = document.getElementById('btnHantar');
        const btnBatal = document.getElementById('btnBatal');
        const selectJawatan = document.getElementById('jawatan');

        let currentSession = null;

        // 1. SEMAK SESI LOG IN SEBAIK SAHAJA LAMAN DIBUKA
        window.onload = function() {
            const savedUser = localStorage.getItem('userSession');
            if (savedUser) {
                currentSession = JSON.parse(savedUser);
                paparkanSkrinUtama();
            }
        };

        // 2. FUNGSI LOG IN
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            btnLogin.disabled = true;
            btnLogin.innerText = "Mengesahkan...";

            const payload = {
                action: "LOGIN",
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' }, // Elak isu preflight CORS
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    currentSession = res.user;
                    localStorage.setItem('userSession', JSON.stringify(res.user));
                    loginForm.reset();
                    paparkanSkrinUtama();
                } else {
                    alert("❌ " + res.message);
                }
                btnLogin.disabled = false;
                btnLogin.innerText = "Log Masuk";
            })
            .catch(err => {
                alert("❌ Ralat Sambungan API: " + err);
                btnLogin.disabled = false;
                btnLogin.innerText = "Log Masuk";
            });
        });

        // 3. FUNGSI PAPAR SKRIN UTAMA BERDASARKAN ROLES
        function paparkanSkrinUtama() {
            loginScreen.style.display = "none";
            mainAppScreen.style.display = "block";

            document.getElementById('lblNamaUser').innerText = currentSession.nama;
            document.getElementById('lblRoleUser').innerText = currentSession.role;

            // Sembunyikan kolum Tindakan jika USER biasa
            const thTindakan = document.getElementById('thTindakan');
            if (currentSession.role !== "ADMIN") {
                thTindakan.style.display = "none";
            } else {
                thTindakan.style.display = "";
            }

            muatDataPenuh();
        }

        // 4. FUNGSI LOG KELUAR
        function logOut() {
            localStorage.removeItem('userSession');
            currentSession = null;
            mainAppScreen.style.display = "none";
            loginScreen.style.display = "block";
        }

        // 5. FUNGSI READ DATA
        function muatDataPenuh() {
            jadualBody.innerHTML = '<tr><td colspan="6" class="status-loading">Sedang memuatkan data...</td></tr>';

            fetch(API_URL)
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    jadualBody.innerHTML = "";

                    if (res.data.length === 0) {
                        jadualBody.innerHTML = '<tr><td colspan="6" class="status-loading">Tiada rekod dijumpai.</td></tr>';
                        return;
                    }

                    res.data.forEach((item, index) => {
                        const baris = document.createElement('tr');
                        const namaClean = item.nama.replace(/'/g, "\\'");

                        // Butang Tindakan (Hanya untuk ADMIN)
                        let kolumTindakan = "";
                        if (currentSession.role === "ADMIN") {
                            kolumTindakan = `
                                <td>
                                    <button class="btn-edit" onclick="sediaEdit('${item.id}', '${namaClean}', '${item.jawatan}', '${item.notel}')">Edit</button>
                                    <button class="btn-padam" onclick="padamRekod('${item.id}', '${item.jawatan}')">Padam</button>
                                </td>
                            `;
                        } else {
                            kolumTindakan = `<td style="display:none;"></td>`;
                        }

                        baris.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${item.timestamp}</td>
                            <td>${item.nama}</td>
                            <td>${item.jawatan}</td>
                            <td>${item.notel}</td>
                            ${kolumTindakan}
                        `;
                        jadualBody.appendChild(baris);
                    });
                }
            });
        }

        // 6. FUNGSI EDIT / BATAL
        function sediaEdit(id, nama, jawatan, notel) {
            document.getElementById('editId').value = id;
            document.getElementById('nama').value = nama;
            document.getElementById('jawatan').value = jawatan;
            document.getElementById('notel').value = notel;
            selectJawatan.disabled = true;

            document.getElementById('tajukBorang').innerText = "Kemas Kini Maklumat Anggota";
            btnHantar.innerText = "Kemas Kini Data";
            btnHantar.style.backgroundColor = "#005b96";
            btnBatal.style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function batalEdit() {
            document.getElementById('editId').value = "";
            borang.reset();
            selectJawatan.disabled = false;
            document.getElementById('tajukBorang').innerText = "Borang Pendaftaran Tugas / Data";
            btnHantar.innerText = "Hantar Data ke Google Sheets";
            btnHantar.style.backgroundColor = "#28a745";
            btnBatal.style.display = "none";
        }

        // 7. FUNGSI PADAM (DELETE)
        function padamRekod(id, jawatan) {
            if (confirm("Adakah anda pasti mahu memadam rekod ini secara kekal?")) {
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: "DELETE",
                        id: id,
                        jawatan: jawatan,
                        role: currentSession.role
                    })
                })
                .then(() => {
                    alert("✅ Rekod Dipadam!");
                    setTimeout(muatDataPenuh, 1000);
                });
            }
        }

        // 8. FUNGSI SUBMIT BORANG (CREATE / UPDATE)
        borang.addEventListener('submit', function(e) {
            e.preventDefault();
            btnHantar.disabled = true;
            btnHantar.innerText = "Sedang Memproses...";

            const editId = document.getElementById('editId').value;
            const isUpdate = editId !== "";

            const payload = {
                action: isUpdate ? "UPDATE" : "CREATE",
                id: editId,
                nama: document.getElementById('nama').value,
                jawatan: document.getElementById('jawatan').value,
                notel: document.getElementById('notel').value,
                role: currentSession.role
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(isUpdate ? "✅ Data Dikemas Kini!" : "✅ Data Dihantar!");
                batalEdit();
                btnHantar.disabled = false;
                setTimeout(muatDataPenuh, 1000);
            })
            .catch(error => {
                alert("❌ Ralat: " + error);
                btnHantar.disabled = false;
            });
        });
    </script>

</body>
</html>
