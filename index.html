<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Anggota - Hospital Kemaman</title>
    
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; color: #333; }
        header { background-color: #005b96; color: white; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        header h1 { font-size: 1.4rem; margin: 0; }
        header h3 { font-size: 1rem; margin: 5px 0 0 0; font-weight: normal; opacity: 0.9; }
        section { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { font-size: 1.1rem; color: #005b96; margin-top: 0; border-bottom: 2px solid #eef2f5; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="date"], input[type="tel"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; background-color: #fafafa; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        .btn-edit { background-color: #ffc107; color: #212529; border: none; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-padam { background-color: #dc3545; color: white; border: none; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }
        .btn-logout { background-color: #6c757d; color: white; border: none; padding: 8px 15px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; float: right; margin-top: -35px; }
        .user-bar { background-color: #e3f2fd; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.85rem; }
        th { background-color: #005b96; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status-loading { text-align: center; color: #666; font-style: italic; }
        .spesifik-box { background-color: #f0f8ff; padding: 12px; border-radius: 6px; border-left: 4px solid #005b96; margin-bottom: 15px; display: none; }
        #mainAppScreen { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>SISTEM DATA ANGGOTA (KKM)</h1>
        <h3>Hospital Kemaman</h3>
    </header>

    <!-- SKRIN LOGIN -->
    <main id="loginScreen">
        <section>
            <h2>Log Masuk Sistem</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ID Pengguna:</label>
                    <input type="text" id="username" placeholder="ADM01 / USR01" required>
                </div>
                <div class="form-group">
                    <label for="password">Kata Laluan:</label>
                    <input type="password" id="password" placeholder="Masukkan kata laluan" required>
                </div>
                <button type="submit" id="btnLogin">Log Masuk</button>
            </form>
        </section>
    </main>

    <!-- SKRIN UTAMA -->
    <main id="mainAppScreen">
        <div class="user-bar">
            <span>Log masuk: <strong id="lblNamaUser">-</strong> (<span id="lblRoleUser">-</span>)</span>
            <button class="btn-logout" onclick="logOut()">Log Keluar</button>
        </div>

        <section>
            <h2 id="tajukBorang">Borang Maklumat Anggota KKM</h2>
            <form id="dataForm">
                <input type="hidden" id="editId" value="">

                <!-- MEDAN UMUM -->
                <div class="form-group">
                    <label for="nama">Nama Penuh (Mengikut MyKad):</label>
                    <input type="text" id="nama" required>
                </div>

                <div class="form-group">
                    <label for="ic">No. Kad Pengenalan:</label>
                    <input type="text" id="ic" placeholder="Contoh: 880101115544" required>
                </div>

                <div class="form-group">
                    <label for="jawatan">Kategori Jawatan:</label>
                    <select id="jawatan" onchange="tukarMedanSpesifik()" required>
                        <option value="">-- Pilih Jawatan --</option>
                        <option value="PEMANDU">Pemandu Kenderaan</option>
                        <option value="PPP">Penolong Pegawai Perubatan (PPP)</option>
                        <option value="PPK">Pembantu Perawatan Kesihatan (PPK)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gred">Gred Jawatan:</label>
                    <input type="text" id="gred" placeholder="Contoh: U29 / H11" required>
                </div>

                <!-- MEDAN SPESIFIK PEMANDU -->
                <div id="boxPemandu" class="spesifik-box">
                    <div class="form-group">
                        <label for="kelas_lesen">Kelas Lesen Memandu:</label>
                        <input type="text" id="kelas_lesen" placeholder="Contoh: D, E, GDL">
                    </div>
                    <div class="form-group">
                        <label for="tamat_lesen">Tarikh Tamat Lesen Memandu:</label>
                        <input type="date" id="tamat_lesen">
                    </div>
                </div>

                <!-- MEDAN SPESIFIK PPP -->
                <div id="boxPPP" class="spesifik-box">
                    <div class="form-group">
                        <label for="pos_basik">Memiliki Pos Basik?</label>
                        <select id="pos_basik">
                            <option value="Tiada">Tiada</option>
                            <option value="Ada">Ada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nama_pos_basik">Nama Pos Basik (Jika Ada):</label>
                        <input type="text" id="nama_pos_basik" placeholder="Contoh: Pos Basik Kecemasan / Perioperatif">
                    </div>
                </div>

                <!-- MEDAN SPESIFIK PPK -->
                <div id="boxPPK" class="spesifik-box">
                    <div class="form-group">
                        <label for="unit_penempatan">Unit / Lokasi Penempatan Tugas:</label>
                        <input type="text" id="unit_penempatan" placeholder="Contoh: Wad 2B / Unit Sajian">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notel">No. Telefon Bimbit:</label>
                    <input type="tel" id="notel" placeholder="Contoh: 0123456789" required>
                </div>

                <button type="submit" id="btnHantar">Hantar Data ke Google Sheets</button>
                <button type="button" id="btnBatal" style="display:none; margin-top:10px; background:#6c757d;" onclick="batalEdit()">Batal Kemas Kini</button>
            </form>
        </section>

        <section>
            <h2>Senarai Keseluruhan Rekod Anggota</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Bil.</th>
                            <th>Nama Anggota</th>
                            <th>No. KP</th>
                            <th>Jawatan & Gred</th>
                            <th>Maklumat Spesifik</th>
                            <th>No. Tel</th>
                            <th id="thTindakan">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="senaraiAnggota"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const API_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbwORdwMQaCeoN5hREga_fzbe---4SE2DESUy3GZ9hcOgvNEN29kUowAjXwcFuNAnISN/exec";

        const loginScreen = document.getElementById('loginScreen');
        const mainAppScreen = document.getElementById('mainAppScreen');
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        
        const borang = document.getElementById('dataForm');
        const jadualBody = document.getElementById('senaraiAnggota');
        const btnHantar = document.getElementById('btnHantar');
        const btnBatal = document.getElementById('btnBatal');
        const selectJawatan = document.getElementById('jawatan');

        let currentSession = null;

        // FUNGSI TUKAR MEDAN SPESIFIK BORANG
        function tukarMedanSpesifik() {
            const j = selectJawatan.value;
            document.getElementById('boxPemandu').style.display = (j === 'PEMANDU') ? 'block' : 'none';
            document.getElementById('boxPPP').style.display = (j === 'PPP') ? 'block' : 'none';
            document.getElementById('boxPPK').style.display = (j === 'PPK') ? 'block' : 'none';
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('userSession');
            if (savedUser) {
                currentSession = JSON.parse(savedUser);
                paparkanSkrinUtama();
            }
        };

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            btnLogin.disabled = true;

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: "LOGIN",
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    currentSession = res.user;
                    localStorage.setItem('userSession', JSON.stringify(res.user));
                    loginForm.reset();
                    paparkanSkrinUtama();
                } else {
                    alert("❌ " + res.message);
                }
                btnLogin.disabled = false;
            });
        });

        function paparkanSkrinUtama() {
            loginScreen.style.display = "none";
            mainAppScreen.style.display = "block";
            document.getElementById('lblNamaUser').innerText = currentSession.nama;
            document.getElementById('lblRoleUser').innerText = currentSession.role;

            const thTindakan = document.getElementById('thTindakan');
            thTindakan.style.display = (currentSession.role === "ADMIN") ? "" : "none";
            muatDataPenuh();
        }

        function logOut() {
            localStorage.removeItem('userSession');
            currentSession = null;
            mainAppScreen.style.display = "none";
            loginScreen.style.display = "block";
        }

        function muatDataPenuh() {
            jadualBody.innerHTML = '<tr><td colspan="7" class="status-loading">Sedang memuatkan data...</td></tr>';

            fetch(API_URL)
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    jadualBody.innerHTML = "";
                    if (res.data.length === 0) {
                        jadualBody.innerHTML = '<tr><td colspan="7" class="status-loading">Tiada rekod dijumpai.</td></tr>';
                        return;
                    }

                    res.data.forEach((item, index) => {
                        const baris = document.createElement('tr');
                        const namaClean = item.nama.replace(/'/g, "\\'");

                        let maklumatSpesifik = "";
                        if (item.jawatan === "PEMANDU") {
                            maklumatSpesifik = `Lesen: ${item.spesifik1} (Tamat: ${item.spesifik2})`;
                        } else if (item.jawatan === "PPP") {
                            maklumatSpesifik = `Pos Basik: ${item.spesifik1} ${item.spesifik2 !== '-' ? '('+item.spesifik2+')' : ''}`;
                        } else if (item.jawatan === "PPK") {
                            maklumatSpesifik = `Penempatan: ${item.spesifik1}`;
                        }

                        let kolumTindakan = "";
                        if (currentSession.role === "ADMIN") {
                            kolumTindakan = `
                                <td>
                                    <button class="btn-padam" onclick="padamRekod('${item.id}', '${item.jawatan}')">Padam</button>
                                </td>
                            `;
                        } else {
                            kolumTindakan = `<td style="display:none;"></td>`;
                        }

                        baris.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${item.nama}</td>
                            <td>${item.ic}</td>
                            <td>${item.jawatan} (${item.gred})</td>
                            <td>${maklumatSpesifik}</td>
                            <td>${item.notel}</td>
                            ${kolumTindakan}
                        `;
                        jadualBody.appendChild(baris);
                    });
                }
            });
        }

        function padamRekod(id, jawatan) {
            if (confirm("Adakah anda pasti mahu memadam rekod ini secara kekal?")) {
                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: "DELETE", id: id, jawatan: jawatan, role: currentSession.role })
                })
                .then(() => {
                    alert("✅ Rekod Dipadam!");
                    setTimeout(muatDataPenuh, 1000);
                });
            }
        }

        borang.addEventListener('submit', function(e) {
            e.preventDefault();
            btnHantar.disabled = true;

            const payload = {
                action: "CREATE",
                nama: document.getElementById('nama').value,
                ic: document.getElementById('ic').value,
                jawatan: selectJawatan.value,
                gred: document.getElementById('gred').value,
                kelas_lesen: document.getElementById('kelas_lesen').value || "-",
                tamat_lesen: document.getElementById('tamat_lesen').value || "-",
                pos_basik: document.getElementById('pos_basik').value || "-",
                nama_pos_basik: document.getElementById('nama_pos_basik').value || "-",
                unit_penempatan: document.getElementById('unit_penempatan').value || "-",
                notel: document.getElementById('notel').value,
                role: currentSession.role
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("✅ Data Berjaya Dihantar!");
                borang.reset();
                tukarMedanSpesifik();
                btnHantar.disabled = false;
                setTimeout(muatDataPenuh, 1000);
            });
        });
    </script>
</body>
</html>
