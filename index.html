<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Anggota - Hospital Kemaman</title>
</head>
<body>

    <!-- TAJUK UTAMA -->
    <header>
        <h1>SISTEM PENGUMPULAN DATA ANGGOTA</h1>
        <h3>Hospital Kemaman</h3>
    </header>

    <main>
        <!-- BORANG INPUT DATA -->
        <section>
            <h2>Borang Pendaftaran Tugas / Data</h2>
            <form id="dataForm">
                <div>
                    <label for="nama">Nama Anggota:</label><br>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama penuh" required>
                </div>
                <br>
                <div>
                    <label for="jawatan">Kategori Anggota:</label><br>
                    <select id="jawatan" name="jawatan" required>
                        <option value="">-- Pilih Jawatan --</option>
                        <option value="PEMANDU">Pemandu</option>
                        <option value="PPP">Penolong Pegawai Perubatan (PPP)</option>
                        <option value="PPK">Pembantu Perawatan Kesihatan (PPK)</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="notel">No. Telefon:</label><br>
                    <input type="tel" id="notel" name="notel" placeholder="Contoh: 0123456789" required>
                </div>
                <br>
                <button type="submit">Hantar Data</button>
            </form>
        </section>

        <hr>

        <!-- ELEMEN BAHARU: JADUAL SENARAI REKOD ANGGOTA -->
        <section>
            <h2>Senarai Rekod Anggota</h2>
            <table border="1" cellpadding="8">
                <thead>
                    <tr>
                        <th>Bil.</th>
                        <th>Nama Anggota</th>
                        <th>Kategori</th>
                        <th>No. Telefon</th>
                    </tr>
                </thead>
                <tbody id="senaraiAnggota">
                    <!-- Contoh Data Harapan (Mock Data) -->
                    <tr>
                        <td>1</td>
                        <td>Ahmad Bin Ali</td>
                        <td>PEMANDU</td>
                        <td>0199998888</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
